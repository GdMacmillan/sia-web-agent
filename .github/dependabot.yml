version: 2

# Every entry waits 7 days after a version is published before proposing it,
# so a compromised or broken release has time to be noticed and pulled first.
# Security updates ignore cooldown by design.
updates:
  # JS/TS dependencies (Yarn, single package)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      langchain:
        patterns:
          - "@langchain/*"
          - "langchain"
          - "langsmith"
      testing:
        patterns:
          - "jest"
          - "babel-jest"
          - "ts-jest"
          - "@jest/*"
          - "@types/jest"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
    ignore:
      # 2.x renames the client config (`servers`, `mode`), drops options the
      # remote-tools middleware sets, and changes the tool-name separator its
      # server lookup parses. That is a migration, not a group bump.
      - dependency-name: "@langchain/mcp-adapters"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # GitHub Actions used by the release workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
