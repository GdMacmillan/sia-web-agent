name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag-check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Releases are consumed as source archives and unpacked on every
      # supported OS, and some can't create symbolic links without extra
      # privileges. Commit a file's contents rather than a link to it.
      - name: Reject symbolic links
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          links=$(git ls-files -s | awk -F '\t' '$1 ~ /^120000 / { print $2 }')
          if [ -n "$links" ]; then
            echo "::error::Symbolic links are not allowed in this repository:"
            echo "$links"
            exit 1
          fi

      - name: Install dependencies
        if: steps.tag-check.outputs.exists == 'false'
        run: yarn install --frozen-lockfile

      - name: Typecheck
        if: steps.tag-check.outputs.exists == 'false'
        run: yarn typecheck

      - name: Lint
        if: steps.tag-check.outputs.exists == 'false'
        run: yarn lint

      - name: Build
        if: steps.tag-check.outputs.exists == 'false'
        run: yarn build

      - name: Test
        if: steps.tag-check.outputs.exists == 'false'
        run: yarn test

      - name: Create tag and release
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
