name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Releases are consumed as source archives and unpacked on every
      # supported OS, and some can't create symbolic links without extra
      # privileges. Commit a file's contents rather than a link to it.
      - name: Reject symbolic links
        run: |
          links=$(git ls-files -s | awk -F '\t' '$1 ~ /^120000 / { print $2 }')
          if [ -n "$links" ]; then
            echo "::error::Symbolic links are not allowed in this repository:"
            echo "$links"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn build
      - run: yarn test
